  # ── SECURITY ──────────────────────────────────────────────────────────────────

  - control_id: CTRL-041
    title: "API Key Management and Authentication"
    description: >
      All backend API endpoints require a valid API key. Keys are stored as
      environment variables, never hardcoded. The default key is not deployed
      to production. Key rotation is documented and can be executed without
      service downtime.
    category: security
    risk_tier: high
    jurisdiction_mappings:
      eu_ai_act:
        - "Article 15(3) — technical robustness measures against unauthorized third-party access"
        - "Article 15(5) — cybersecurity measures commensurate with risk"
      nist_ai_rmf:
        - "GOVERN 1.6 — policies for AI deployment include security requirements"
        - "MANAGE 1.3 — responses to identified security risks are implemented"
      colorado_caia:
        - "C.R.S. § 6-1-1705(1)(b) — mitigation measures include security controls protecting consumer data"
      california_admt:
        - "Cal. Civ. Code § 1798.150 — security breach notification; API key security prevents breaches"
      florida_fdbr:
        - "Fla. Stat. § 501.171(2) — controller shall implement and maintain reasonable security procedures and practices"
    evidence_requirements:
      - "api_security_review.md"
      - "key_rotation_procedure.md"
    automation_status: semi_automated
    owner_role: security_lead

  - control_id: CTRL-042
    title: "Continuous Secret Scanning via CI"
    description: >
      A gitleaks secret scanner runs on every push and pull request in the
      CI pipeline. Any detected secret causes the build to fail. Custom
      patterns for API keys, service credentials, and Stripe secrets are
      maintained in .gitleaks.toml.
    category: security
    risk_tier: high
    jurisdiction_mappings:
      eu_ai_act:
        - "Article 15(5) — cybersecurity measures include prevention of unauthorized access to training data and model parameters"
      nist_ai_rmf:
        - "GOVERN 1.6 — policies for AI development include secret management"
        - "MANAGE 1.3 — responses to security risks include automated detection controls"
      colorado_caia:
        - "C.R.S. § 6-1-1705(1)(b) — technical mitigation measures include secret scanning"
      california_admt:
        - "Cal. Civ. Code § 1798.150(a)(1) — security breach prevention; secret scanning is a preventative control"
      florida_fdbr:
        - "Fla. Stat. § 501.171(2) — reasonable security procedures include automated scanning"
    evidence_requirements:
      - "gitleaks_config.json"
      - "latest_secret_scan_report.json"
    automation_status: automated
    owner_role: security_lead

  - control_id: CTRL-043
    title: "Database Service-Role Key Isolation"
    description: >
      The Supabase service-role key—which bypasses row-level security—is held
      exclusively by the backend service and never exposed to client code,
      environment logs, or CI artifacts. All client-facing code uses the
      anon key. Backend queries are explicitly scoped to the authenticated user.
    category: security
    risk_tier: high
    jurisdiction_mappings:
      eu_ai_act:
        - "Article 15(3) — technical measures prevent unauthorized access to system components"
        - "Article 15(5) — cybersecurity measures commensurate with risk; service-key isolation is foundational"
      nist_ai_rmf:
        - "GOVERN 1.6 — policies include database access controls"
        - "MANAGE 1.3 — responses to security risks include key isolation"
      colorado_caia:
        - "C.R.S. § 6-1-1705(1)(b) — mitigation measures include access controls"
      california_admt:
        - "Cal. Civ. Code § 1798.150(a)(1) — data security measures include access control"
      florida_fdbr:
        - "Fla. Stat. § 501.171(2) — reasonable security procedures include access controls for systems holding personal data"
    evidence_requirements:
      - "key_isolation_architecture.md"
      - "database_access_review.md"
    automation_status: semi_automated
    owner_role: security_lead

  - control_id: CTRL-044
    title: "Row-Level Security Enforcement"
    description: >
      Supabase RLS policies are enabled on all tables containing personal data.
      RLS is the second line of defense—backend queries are explicitly scoped
      to the authenticated user as the first line. RLS policies are reviewed
      after every schema migration.
    category: security
    risk_tier: high
    jurisdiction_mappings:
      eu_ai_act:
        - "Article 15(3) — technical measures ensure that only authorized persons have access to training data and AI system outputs"
      nist_ai_rmf:
        - "GOVERN 1.6 — policies include database security requirements"
        - "MANAGE 1.3 — security risk responses include row-level access controls"
      colorado_caia:
        - "C.R.S. § 6-1-1705(1)(b) — mitigation measures include data isolation controls"
      california_admt:
        - "Cal. Civ. Code § 1798.150(a)(1) — security measures include access control at data level"
      florida_fdbr:
        - "Fla. Stat. § 501.171(2) — reasonable security procedures include database-level access controls"
    evidence_requirements:
      - "rls_policy_audit.sql"
      - "rls_test_report.json"
    automation_status: semi_automated
    owner_role: security_lead

  - control_id: CTRL-045
    title: "Webhook Signature Verification"
    description: >
      All incoming Stripe webhooks are verified using Stripe's signature
      validation before any action is taken. Invalid signatures result in
      immediate rejection (HTTP 400) with no state change. Webhook secret
      is stored as an environment variable.
    category: security
    risk_tier: limited
    jurisdiction_mappings:
      eu_ai_act:
        - "Article 15(3) — technical robustness measures against attempts to alter system behavior"
      nist_ai_rmf:
        - "MANAGE 1.3 — responses to security risks include webhook integrity verification"
      colorado_caia:
        - "C.R.S. § 6-1-1705(1)(b) — technical mitigation measures include webhook security"
      california_admt:
        - "Cal. Civ. Code § 1798.150(a)(1) — security measures include API integrity controls"
      florida_fdbr:
        - "Fla. Stat. § 501.171(2) — reasonable security procedures include transaction integrity verification"
    evidence_requirements:
      - "webhook_security_test.json"
      - "webhook_signature_review.md"
    automation_status: automated
    owner_role: security_lead

