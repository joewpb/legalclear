# apt deps: Tesseract OCR (ingestion), WeasyPrint (Pango/Cairo stack),
# and Playwright Chromium runtime libs (Phase 23, pdfa_generator).
#
# 2026-08-24 audit in the Railway nixpacks base (ubuntu-1745885067):
# - gobject ships INSIDE libglib2.0-0t64 on this base — there is no
#   libgobject-2.0-* package at all, so the t64 name is mandatory.
# - libglib2.0-0 and libgobject-2.0-0 do NOT exist in this base; earlier
#   builds silently no-op'd them (apt installs the resolvable rest and
#   exits 0). Prod's "cannot load library libgobject-2.0-0" was WeasyPrint
#   dlopening the bare soname first and failing in a stale-cache image.
# - libgdk-pixbuf2.0-0 IS the valid name in this base (2.40.2).
[phases.setup]
aptPkgs = [
    "tesseract-ocr",
    "tesseract-ocr-eng",
    "libcairo2",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libpangoft2-1.0-0",
    "libglib2.0-0t64",
    "libgdk-pixbuf2.0-0",
    "libffi-dev",
    "shared-mime-info",
    # Phase 23 — Playwright Chromium runtime deps
    "libnss3",
    "libnspr4",
    "libdbus-1-3",
    "libatk1.0-0t64",
    "libatk-bridge2.0-0t64",
    "libcups2t64",
    "libdrm2",
    "libxkbcommon0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libasound2t64",
    "fonts-liberation"
]

# Do NOT override [phases.install]. The Nixpacks Python provider detects
# requirements.txt, creates the /opt/venv virtualenv, puts /opt/venv/bin
# on PATH, and runs `pip install -r requirements.txt` automatically. If
# we declare our own install cmds the venv setup gets skipped and bare
# `pip` is not found (which broke the first Phase 23 deploy attempt).

[phases.build]
# Runs after the Python provider's install phase — venv pip is on PATH
# by now, so `python` resolves to /opt/venv/bin/python and the bundled
# Playwright Chromium downloads into /root/.cache/ms-playwright/.
cmds = [
    "python -m playwright install chromium",
    # WeasyPrint's ffi dlopens the BARE sonames first (libgobject-2.0-0,
    # libpango-1.0-0, libharfbuzz-0, ...). A healthy ld cache resolves the
    # versioned names, but a stale cache (built before apt in the layer
    # order) leaves every bare name unresolvable — the prod artifact 500.
    # These symlinks make the bare names resolve through the default
    # search path regardless of cache state. Verified in the Railway base:
    # bare-name dlopen fails before, passes after.
    "ldconfig",
    "for pair in 'libgobject-2.0.so.0 libgobject-2.0-0' 'libpango-1.0.so.0 libpango-1.0-0' 'libharfbuzz.so.0 libharfbuzz-0' 'libfontconfig.so.1 libfontconfig-1' 'libpangoft2-1.0.so.0 libpangoft2-1.0-0'; do set -- $pair; [ -e /usr/lib/x86_64-linux-gnu/$1 ] && ln -sf $1 /usr/lib/x86_64-linux-gnu/$2 || true; done",
]
