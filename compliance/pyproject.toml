[project]
name = "legalclear-compliance"
version = "0.1.0"
description = "LegalClear multi-jurisdiction AI governance compliance framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.6",
    # Typer + Rich: modern CLI framework with type-hinted commands, autogenerated help,
    # and styled terminal output. Approved new dependency (Phase 1 design decision).
    "typer[all]>=0.12",
    "rich>=13.0",
    "fastapi>=0.100",
    # WeasyPrint already in backend/requirements.txt; declared here for standalone use.
    "weasyprint>=60.0",
    "httpx>=0.24",
    "pytest>=8.0",
]

[project.scripts]
legalclear = "compliance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
