name: Schema Parity Check

# Runs scripts/parity_check.py (read-only) to diff supabase/migrations/*.sql
# against the live prod schema and fails the build on drift.
#
# LANE-C GATE RESOLVED 2026-08-17: push trigger enabled (supabase/migrations/,
# parity_check.py, this file) + nightly 06:00 UTC schedule. A push-only check
# cannot catch the failure mode this exists for — prod drifted four times via
# manual SQL-editor edits, which never trigger a push — so the nightly cron is
# the primary safety net.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "scripts/parity_check.py"
      - ".github/workflows/parity.yml"

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run schema parity check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/parity_check.py
