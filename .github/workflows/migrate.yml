name: Migrations

on:
  workflow_dispatch: {}
  # LANE-C GATE: ENABLED 2026-08-16 after secret confirmation.
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          # Secrets pasted via the GitHub UI often carry a trailing newline;
          # strip CR/LF so URL construction and Bearer auth can't break on
          # control characters (parity CI hit exactly this: InvalidURL).
          SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n')"
          SUPABASE_PROJECT_REF="$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '\r\n')"
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"

          # POST one query to the Management API; SQL arrives on stdin.
          # Prints the HTTP status code; response body lands in $1.
          run_query() {
            local body_file="$1"
            curl -sS -o "$body_file" -w "%{http_code}" -X POST "$API" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @-
          }

          FAILED=0
          # Deterministic timestamp order; strictly sequential (no parallelism).
          for f in $(ls supabase/migrations/*.sql | sort); do
            name=$(basename "$f")
            # Per-file DB check: the baseline migration seeds 26 already-
            # applied files, which a once-off read can never see. Ask the
            # database every time — DB-truth, no in-memory state. A boolean
            # EXISTS + jq (not a filename grep): the API response envelope
            # echoes the submitted query, so grepping for the filename
            # false-matches every time.
            if curl -sS -X POST "$API" \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data "$(jq -Rn --arg n "$name" '{query: ("select exists(select 1 from public.schema_migrations where filename = " + ($n|@sh) + ") as applied")}' /dev/null)" \
                  -o /tmp/chk.json 2>/dev/null && \
               jq -e '.. | select(. == true)' /tmp/chk.json >/dev/null 2>&1; then
              echo "SKIP $name"
              continue
            fi
            echo "APPLY $name"
            # Each migration is an independent HTTP call — no cross-call
            # transaction. On any non-2xx: halt immediately, do not continue
            # to later migrations, print the failing filename and the API
            # error body. No blind retries.
            code=$(jq -Rs '{query: .}' < "$f" | run_query /tmp/resp.json || echo 000)
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              jq -Rn --arg n "$name" \
                '{query: ("insert into public.schema_migrations(filename) values (" + ($n|@sh) + ") on conflict (filename) do nothing")}' \
                | run_query /tmp/rec.json > /dev/null
              echo "OK   $name"
            else
              echo "FAIL $name (HTTP $code)"
              cat /tmp/resp.json
              FAILED=1
              break
            fi
          done
          exit $FAILED
