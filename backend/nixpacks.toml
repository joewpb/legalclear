# AUDIT 2026-08-24 (single-pass, noble container): this exact list + pip
# weasyprint (latest, unpinned as prod installs) renders HTML().write_pdf()
# on ROUND 1 with no additional packages. The gobject/glib/pangoft2 entries
# are REQUIRED — pangocffi dlopens each soname directly and GLib is split
# across Debian binary packages (libglib2.0-0 does not contain gobject).
# If a Railway build ever shows prod missing one of these, the apt phase did
# not run — check the build log's apt section, do not add more packages.
[phases.setup]
# Existing Part A apt deps (Tesseract OCR for ingestion; Cairo/Pango for
# WeasyPrint) — kept verbatim. Phase 23 appends the dynamic libraries
# Playwright's bundled Chromium binary needs at runtime. Without these
# the chromium.launch() call in src/services/pdfa_generator.py errors
# even when `playwright install chromium` succeeds at build time.
#
# Several packages were renamed with a `t64` suffix on Ubuntu 24.04
# (noble) as part of the Debian-wide 64-bit time_t migration; the
# legacy names (libasound2, libcups2, libatk1.0-0, libatk-bridge2.0-0)
# have no installation candidate on noble.
aptPkgs = [
    "tesseract-ocr",
    "tesseract-ocr-eng",
    "libcairo2",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libpangoft2-1.0-0",
    "libglib2.0-0",
    "libgobject-2.0-0",
    "libgdk-pixbuf2.0-0",
    "libffi-dev",
    "shared-mime-info",
    # Phase 23 — Playwright Chromium runtime deps
    "libnss3",
    "libnspr4",
    "libdbus-1-3",
    "libatk1.0-0t64",
    "libatk-bridge2.0-0t64",
    "libcups2t64",
    "libdrm2",
    "libxkbcommon0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libasound2t64",
    "fonts-liberation"
]

# Do NOT override [phases.install]. The Nixpacks Python provider detects
# requirements.txt, creates the /opt/venv virtualenv, puts /opt/venv/bin
# on PATH, and runs `pip install -r requirements.txt` automatically. If
# we declare our own install cmds the venv setup gets skipped and bare
# `pip` is not found (which broke the first Phase 23 deploy attempt).

[phases.build]
# Runs after the Python provider's install phase — venv pip is on PATH
# by now, so `python` resolves to /opt/venv/bin/python and the bundled
# Playwright Chromium downloads into /root/.cache/ms-playwright/.
cmds = ["python -m playwright install chromium"]
