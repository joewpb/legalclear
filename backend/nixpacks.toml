# WeasyPrint native dependencies (2026-08-24).
#
# The I-7 artifact generators render PDFs with weasyprint, which needs
# Pango/Cairo system libraries. Nixpacks installs Python deps but not
# these; without them, prod artifact endpoints (claim_log,
# policy_request_letter, …) returned 500 while the same code rendered
# valid PDFs locally. Minimal runtime set:
[phases.setup]
aptPkgs = [
  "libpango-1.0-0",
  "libpangoft2-1.0-0",
  "libcairo2",
  "libgdk-pixbuf-2.0-0",
  "libharfbuzz0b",
  "libharfbuzz-subset0",
  "libffi8",
  "fontconfig",
  "fonts-dejavu-core",
  "shared-mime-info",
]
