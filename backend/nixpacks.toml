[phases.setup]
# Existing Part A apt deps (Tesseract OCR for ingestion; Cairo/Pango for
# WeasyPrint) — kept verbatim. Phase 23 appends the dynamic libraries
# Playwright's bundled Chromium binary needs at runtime. Without these
# the chromium.launch() call in src/services/pdfa_generator.py errors
# even when `playwright install chromium` succeeds at build time.
aptPkgs = [
    "tesseract-ocr",
    "tesseract-ocr-eng",
    "libcairo2",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libgdk-pixbuf2.0-0",
    "libffi-dev",
    "shared-mime-info",
    # Phase 23 — Playwright Chromium runtime deps. Several of these were
    # renamed with a `t64` suffix on Ubuntu 24.04 (noble) as part of the
    # Debian-wide 64-bit time_t migration; the legacy names (libasound2,
    # libcups2, libatk1.0-0, libatk-bridge2.0-0) have no installation
    # candidate on noble and break the apt install step. Use the t64
    # variants verbatim.
    "libnss3",
    "libnspr4",
    "libdbus-1-3",
    "libatk1.0-0t64",
    "libatk-bridge2.0-0t64",
    "libcups2t64",
    "libdrm2",
    "libxkbcommon0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libasound2t64",
    "fonts-liberation"
]

[phases.install]
# Pip-installs everything in requirements.txt, then downloads the
# Playwright-pinned Chromium build into ~/.cache/ms-playwright/ so
# pdfa_generator.py can spawn it at request time. System libs above
# satisfy the binary's dynamic linker.
cmds = [
    "pip install -r requirements.txt",
    "python -m playwright install chromium"
]
