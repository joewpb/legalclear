    risk_tier: high
    jurisdiction_mappings:
      eu_ai_act:
        - "Article 72(4) — providers report serious incidents to national competent authorities"
        - "Article 16(h) — providers notify national authorities and deployers of serious incidents"
        - "Article 9(4) — risk management measures include incident response"
      nist_ai_rmf:
        - "MANAGE 4.1 — processes for post-incident analysis established in advance"
        - "MANAGE 1.1 — risk treatment plans include incident response"
      colorado_caia:
